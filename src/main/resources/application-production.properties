spring.application.name=app

# =========================
# Server
# =========================
server.port=${PORT:8080}

# =========================
# MySQL / Railway
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =========================
# Hikari Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =========================
# File Uploads
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.forward-headers-strategy=FRAMEWORK

# =========================
# JWT / RSA Security
# =========================
# If you are using your own custom RsaKeyProperties configuration class, map them as raw text strings:
rsa.private-key=${RSA_PRIVATE_KEY}
rsa.public-key=${RSA_PUBLIC_KEY}

#api key for geolocation
geoapify.api-key=${GEOAPIFY_API_KEY}



# ==========================================================================
# CORRECTED GMAIL SMTP SERVER CONFIGURATIONS
# ==========================================================================
# 1. FIXED: Removed the accidental url protocol prefix text strings
spring.mail.host=smtp.gmail.com

# 2. FIXED: Corrected the standard secure TLS port assignment number
spring.mail.port=587

spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}


resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}
resend.from-name=${RESEND_FROM_NAME:kasoa.pl}

# Essential connection and handshake encryption mappings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

stripe.success-url: ${FRONTEND_URL}/checkout/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url: ${FRONTEND_URL}/checkout/cancel
app.domain=${APP_DOMAIN}

stripe.api-key=${STRIPE_API_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# The flat rate displayed anonymously to the buyer
shipping.buyer-contribution-single= 9.99
shipping.buyer-contribution-group= 12.99